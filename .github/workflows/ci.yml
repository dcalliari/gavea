name: Gávea CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Install Gávea Frota dependencies
        run: npm install --prefix extensions/gavea-frota --ignore-scripts

      - name: Typecheck client
        run: npm run typecheck-client

      - name: Compile Git extension
        run: npm run gulp compile-extension:git

      - name: Compile Gávea Frota extension
        run: npm run gulp compile-extension:gavea-frota
